<button class="ui-primary-button" [attr.type]="type()" [disabled]="disabled()">
  @if (icon() === 'leading' && iconSrc(); as src) {
    <img class="ui-primary-button__icon" [src]="src" alt="" />
  }
  <span class="ui-primary-button__label">{{ label() }}</span>
  @if (icon() === 'trailing' && iconSrc(); as src) {
    <img class="ui-primary-button__icon" [src]="src" alt="" />
  }
</button>
